<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Discordia Barber</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0D0D;--c1:#1A1A1A;--c2:#262626;--g:#F5A300;--g2:#FFB800;--t:#F5F5F5;--m:#A0A0A0;--ok:#3DDC84;--bad:#FF5C5C;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:16px/1.4 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
#app{max-width:520px;margin:auto;padding:16px 16px 120px}
h2{font:400 28px Anton,Impact,sans-serif;letter-spacing:.5px}
h3{font-size:15px;margin:2px 0 10px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input{width:100%;background:var(--c2);border:1px solid #333;border-radius:12px;padding:13px;outline:none;margin-bottom:8px}
input:focus,button:focus-visible{border-color:var(--g);outline:2px solid var(--g)}
.card{background:var(--c1);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.btn{border:0;border-radius:14px;padding:15px;font-weight:800;background:linear-gradient(135deg,var(--g),var(--g2));color:#111;width:100%}
.opt{background:var(--c2);border:1.5px solid #333;border-radius:14px;padding:13px 8px;font-weight:600;text-align:center;width:100%;margin-bottom:8px}
.opt.on{border-color:var(--g);background:#3a2a00;color:var(--g2)}
.ghost{background:none;border:1px solid #444;border-radius:10px;padding:7px 10px;color:var(--m);flex:0 0 auto}
.sub{color:var(--m);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.big{font:400 32px Anton,Impact,sans-serif;color:var(--g2)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid #2a2a2a}
th{color:var(--m);font-weight:600}.r{text-align:right}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;background:rgba(30,30,30,.92);backdrop-filter:blur(12px);border:1px solid #333;border-radius:999px;padding:6px;box-shadow:0 8px 30px #000a;z-index:5}
nav button{background:none;border:0;padding:11px 18px;border-radius:999px;color:var(--m);font-weight:600}
nav button.on{background:var(--g);color:#111}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#2d2d2d;border:1px solid var(--g);padding:11px 16px;border-radius:14px;z-index:20;display:flex;gap:12px;align-items:center;max-width:92vw}
#toast.bad{border-color:var(--bad)}
#toast button{background:none;border:0;color:var(--g2);font-weight:800}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:30}
.modal>div{background:var(--c1);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
summary{font-weight:600;cursor:pointer;padding:2px 0}
a{color:var(--g2)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden>
  <button data-a="tab" data-v="reg">Registrar</button>
  <button data-a="tab" data-v="cli">Clientes</button>
  <button data-a="tab" data-v="res">Resumen</button>
</nav>
<div id="toast" hidden></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxnPRxri-mZ4JfkhRNOoCLBEmHg8AC0ObEJ7RP-PYwKk3oU-_P1lpxAVXlJSrGgYpxPdg/exec';
const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Argentina/Buenos_Aires' });
const sum = (a, f) => a.reduce((x, y) => x + Number(f(y)), 0);
let S = { t: localStorage.getItem('t'), me: null, d: null, tab: 'reg', svc: null, cli: null, met: null, precio: '', per: 'hoy', q: '', A: [] };

async function api(a, p = {}) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ a, t: S.t, ...p }) });
  const j = await r.json();
  if (j.error === 'SESION') { out(); throw new Error('La sesión venció. Ingresá de nuevo.'); }
  if (!j.ok) throw new Error(j.error);
  return j;
}
async function run(f) { try { return await f(); } catch (e) { toast(e.message, 0, 1); } }
function toast(m, undo, err) {
  const t = $('#toast'); toast.u = undo;
  t.innerHTML = esc(m) + (undo ? ' <button data-a="undo">Deshacer</button>' : '');
  t.className = err ? 'bad' : ''; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, undo ? 8000 : 3000);
}
function out() { localStorage.removeItem('t'); S.t = null; S.d = null; loginView(); }

/* ---------- Login ---------- */
function loginView() {
  $('#nav').hidden = true;
  $('#app').innerHTML = `<div style="text-align:center;padding-top:5vh"><img src="logo.png" alt="Discordia Barber" style="width:82%;max-width:320px"></div>
  <div class="card" style="margin-top:24px"><input id="dni" inputmode="numeric" placeholder="DNI" autocomplete="username">
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button class="btn" data-a="login">Ingresar</button></div>`;
}
const H = {};
H.login = () => run(async () => {
  const j = await api('login', { dni: $('#dni').value, p: $('#pw').value });
  S.t = j.t; localStorage.setItem('t', j.t); await start();
});
H.out = out;
async function start() {
  const j = await api('init'); S.me = j.me; S.d = j; render();
}

/* ---------- Estructura ---------- */
function render() {
  $('#nav').hidden = false;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.tab));
  ({ reg: regView, cli: cliView, res: resView })[S.tab]();
}
function head(t) {
  return `<div class="row" style="margin-bottom:12px"><div><h2>${t}</h2><div class="sub">${esc(S.me.nombre)} ${esc(S.me.apellido)}${S.me.rol === 'admin' ? ' · Dueño' : ''}</div></div><button class="ghost" data-a="out">Salir</button></div>`;
}
H.tab = d => { S.tab = d.v; S.q = ''; render(); };

/* ---------- Registrar ---------- */
function regView() {
  const d = S.d;
  $('#app').innerHTML = head('Registrar corte') + `
  <div class="card"><h3>Servicio</h3><div class="row">${d.servicios.map(s =>
    `<button class="opt ${S.svc?.id === s.id ? 'on' : ''}" data-a="svc" data-id="${s.id}">${esc(s.nombre)}<br>${money(s.precio)}</button>`).join('')}</div>
  <h3>Precio cobrado</h3><input id="precio" inputmode="numeric" value="${esc(S.precio)}" placeholder="Precio"></div>
  <div class="card"><h3>Cliente</h3>${S.cli
    ? `<div class="row"><b>${esc(S.cli.nombre)} ${esc(S.cli.apellido)}</b><button class="ghost" data-a="clr">Cambiar</button></div>`
    : `<input id="q" placeholder="Buscar
